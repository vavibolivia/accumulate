<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>힘이 붙은 매집 3선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 결론(3개 코인) → 고른 방법 → 시장 배경 → 빠진 코인 → 검증·한계. 한 장을 위에서 아래로 읽는다. */
:root{
  color-scheme:dark;
  --bg:#0c0f13; --panel:#13171d; --panel2:#181d25; --line:#252c37; --line2:#323b48;
  --ink:#e9ecf0; --ink2:#aab3c0; --ink3:#77818f;
  --accent:#f0b90b; --accent-soft:rgba(240,185,11,.13);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;      /* 계열: 1 파랑(가격·ETH) 2 주황(BTC) 3 청록(순매수·알트) */
  --good:#2fbf8a; --bad:#ef5d6f; --warn:#e2a23a;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#dfe3ea; --line2:#c9d0da;
  --ink:#12161c; --ink2:#48515e; --ink3:#727c8a;
  --accent:#9a6f00; --accent-soft:rgba(190,140,0,.12);
  --s1:#2a78d6; --s2:#eb6834; --s3:#12936a;
  --good:#0f8a5f; --bad:#cf3247; --warn:#a86a00;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f1f3f6; --line:#dfe3ea; --line2:#c9d0da;
  --ink:#12161c; --ink2:#48515e; --ink3:#727c8a;
  --accent:#9a6f00; --accent-soft:rgba(190,140,0,.12);
  --s1:#2a78d6; --s2:#eb6834; --s3:#12936a;
  --good:#0f8a5f; --bad:#cf3247; --warn:#a86a00;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;line-height:1.15}
h2{font-size:21px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.lede{font-size:17px;color:var(--ink2);max-width:66ch}
.scope{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink3)}
.scope b{color:var(--ink2);font-weight:600}
header{display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec-head p{color:var(--ink2);max-width:72ch}

/* 3개 코인 */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.picks{grid-template-columns:1fr}}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pick-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tick{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.pname{color:var(--ink3);font-size:13px}
.tag{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.verdict{font-size:14px;color:var(--ink2);min-height:4.8em}
.chart-label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3);gap:8px}
.chart-label b{color:var(--ink);font-weight:600}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.kv dt{color:var(--ink3);margin:0}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
dl{margin:0}
.risk{font-size:12.5px;color:var(--ink2);background:var(--panel2);border-radius:10px;padding:10px 12px}
.risk b{color:var(--warn);font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* 고른 방법 */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step .big{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.1}
.step .big small{font-size:13px;color:var(--ink3);font-weight:400}
.step p{font-size:12.5px;color:var(--ink2)}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:64px 1fr 48px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .track{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--s3);border-radius:5px}
.bar-row .fill.dim{background:var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
ul.take{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;color:var(--ink2);font-size:14px}
ul.take b{color:var(--ink)}

/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:760px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
th:first-child,td:first-child{text-align:left}
td:last-child,th:last-child{text-align:left;white-space:normal;min-width:240px;color:var(--ink2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono)}
td .tk{font-family:var(--mono);font-weight:600}
.grp td{background:var(--panel2);color:var(--ink3);font-size:11.5px;font-weight:600;letter-spacing:.04em}

.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.checks{grid-template-columns:1fr}}
.checks ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--ink2)}
.checks b{color:var(--ink)}
details{font-size:12.5px;color:var(--ink3)}
details summary{cursor:pointer;color:var(--ink2)}
details a{color:var(--ink2)}
.src{columns:2;column-gap:28px;margin:10px 0 0;padding-left:1.1em}
@media (max-width:760px){.src{columns:1}}
.src li{break-inside:avoid;margin-bottom:5px;overflow-wrap:anywhere}
footer{font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:16px}

/* 차트 공통 */
.tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.45;color:var(--ink);white-space:nowrap;z-index:5;transform:translate(-50%,-100%);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip .d{color:var(--ink3)}
svg text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{stroke:var(--line2);stroke-width:1}
svg .zero{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
svg .cross{stroke:var(--ink3);stroke-width:1}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="scope" id="scope"></div>
  </header>

  <section>
    <div class="sec-head">
      <h2 id="concl-h"></h2>
      <p id="concl-p"></p>
    </div>
    <div class="picks" id="picks"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>어떻게 골랐나</h2>
      <p id="how-p"></p>
    </div>
    <div class="steps" id="steps"></div>
    <div class="two">
      <div class="card">
        <h3 id="rules-h"></h3>
        <ul class="take" id="rules"></ul>
      </div>
      <div class="card">
        <h3 id="bars-h"></h3>
        <p style="font-size:13px;color:var(--ink2)" id="bars-p"></p>
        <div class="bars" id="sens"></div>
        <p style="font-size:12.5px;color:var(--ink3)" id="sens-note"></p>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2 id="mkt-h"></h2>
      <p id="mkt-lede"></p>
    </div>
    <div class="two">
      <div class="card">
        <div class="chart-label"><b>비트코인 가격 (USDT, 일별 종가)</b><span id="btc-range"></span></div>
        <div class="chart" id="c-btc"></div>
        <div class="chart-label"><b>월별 시장가 순매수 (억 USDT)</b><span>0 아래 = 순매도</span></div>
        <div class="chart" id="c-flow"></div>
        <div class="legend"><span><i style="background:var(--s2)"></i>BTC</span><span><i style="background:var(--s1)"></i>ETH</span><span><i style="background:var(--s3)"></i>그 외 코인</span></div>
        <details><summary>월별 숫자 표로 보기</summary><div class="tbl-wrap" style="margin-top:8px"><table id="flow-table" style="min-width:520px"></table></div></details>
      </div>
      <div class="card">
        <h3>데이터와 보도로 본 1년</h3>
        <ul class="take" id="mkt-take"></ul>
      </div>
    </div>
  </section>

  <section>
    <div class="sec-head">
      <h2 id="oth-h"></h2>
      <p id="oth-p"></p>
    </div>
    <div class="tbl-wrap"><table id="others"></table></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>검증한 것과 한계</h2>
    </div>
    <div class="checks">
      <div class="card"><h3>검증한 것</h3><ul id="verified"></ul></div>
      <div class="card"><h3>알아 둘 한계</h3><ul id="limits"></ul></div>
    </div>
    <details><summary>외부 자료 출처</summary><ol class="src" id="sources"></ol></details>
  </section>

  <footer id="foot"></footer>
</div>

const N = {"title": "힘이 붙은 매집 3선", "eyebrow": "바이낸스 현물 · 최근 1년 시장가 체결 분석 · 두 번째 관점", "h1": "하락장에서 비트코인보다 강했던 매집 3개", "lede": "첫 장이 \"아직 오르지 않은 조용한 저점\"을 찾았다면, 이 장은 반대쪽을 봅니다. 순매수가 꾸준하고 강하며 최근까지 이어졌고, 가격도 비트코인보다 잘 버틴 코인입니다. 아홉 가지 지표를 합친 점수로 JST, TRX, MORPHO가 뽑혔습니다.", "scope": ["<b>기간</b> 2025-11-14 ~ 2026-11-13 (365일, UTC)", "<b>데이터</b> 바이낸스 현물 1분봉 · 1,366개 페어", "<b>지표</b> 시장가 매수 − 시장가 매도 (그날 환율로 USDT 환산)", "<b>대상</b> 368개 코인 (스테이블·래핑·BTC 제외, 상장 1년 이상)"], "pickList": ["JST", "TRX", "MORPHO"], "conclH": "결론: JST · TRX · MORPHO", "conclP": "세 코인은 시장 전체가 순매도인 1년 동안 순매수가 가장 꾸준했고, BTC로 나눈 가격이 1년 전보다 높습니다. 위 그래프는 BTC 대비 가격(1년 전 = 100), 아래 그래프는 누적 순매수입니다.", "picks": {"JST": {"name": "JUST", "tag": "종합 1위 · 가장 꾸준함", "verdict": "52주 중 43주가 순매수였고, 거래대금 대비 순매수 비율(4.45%)이 전체에서 가장 높습니다. 1년 순매수의 41%가 최근 90일에 들어와 속도가 붙었습니다. 가격은 4배가 됐고 비트코인과 거의 따로 움직였습니다(상관 0.05).", "risk": "매수 주체가 프로토콜 자신일 수 있습니다. JustLend는 2025년 10월부터 다섯 차례 바이백·소각으로 공급의 약 19%를 없앴다고 밝혔습니다(홍보성 자료, 집행 거래소 미확인). 저스틴 선 생태계 안의 매수이고, 이미 크게 오른 가격입니다."}, "TRX": {"name": "TRON", "tag": "규모 1위", "verdict": "1년 순매수 5.18억 USDT로 전체에서 가장 큽니다. 2025년 12월부터 2026년 9월까지 10개월 연속 순매수였고, 가장 많이 산 닷새의 비중이 16%로 고릅니다. 시장이 무너지는 동안 가격은 +7%였습니다.", "risk": "최근 90일은 순매도(−280만 USDT)로 꺾였고, 10월은 −3,300만이었습니다. BTC 대비 120일 추세도 −24%입니다. 해킹 직후 닷새가 1년 순매수의 8.1%를 차지합니다. 리라 페어에서는 7,700만 USDT 순매도였고, 주요 매수자로 보도된 Tron Inc.는 계열 회사입니다."}, "MORPHO": {"name": "Morpho", "tag": "기관 매수 배경", "verdict": "52주 중 39주가 순매수였고, 1년 순매수의 48%가 최근 90일에 들어왔습니다. 코인 중앙값이 61% 내린 해에 가격이 −3%로 버텨 BTC 대비 +35%입니다. 2월 아폴로의 최대 9천만 개 매입 계약, 6월 1.75억 달러 토큰 투자가 있었습니다(보도).", "risk": "매달 유통량의 약 1.6%가 내부자·투자자에게 풀리고 2028년 4월까지 이어집니다(보도). 유통량은 상장 뒤 약 두 배가 됐습니다. 수수료 배분은 꺼져 있어 토큰 보유자에게 돌아가는 수익이 없습니다. 바이낸스 상장이 2025년 10월 3일이라 비교할 과거가 짧습니다."}}, "howP": "\"매집의 힘과 추세\"를 아홉 가지 지표로 나눠 코인마다 표준점수를 매기고 더했습니다. 한 지표가 튀어서가 아니라 여러 지표에서 고르게 높아야 위로 올라옵니다.", "steps": [{"t": "분석 대상", "n": "368", "u": "개 코인", "d": "스테이블·래핑·BTC 제외, 상장 1년 이상, 1년 거래대금 3천만 USDT 이상."}, {"t": "순매수인 코인", "n": "94", "u": "개", "d": "1년 순매수가 +이고 1년 거래대금이 1억 USDT 이상인 코인만 점수를 매겼습니다."}, {"t": "지표", "n": "9", "u": "가지", "d": "지속 3, 강도 2, 추이 1, BTC 대비 강함 2, 독립성 1. 모두 같은 비중으로 더했습니다."}, {"t": "상위", "n": "3", "u": "개", "d": "JST 18.7점, TRX 11.7점, MORPHO 9.2점. 4위 COMP는 9.1점으로 3위와 거의 같습니다."}], "rulesH": "아홉 가지 지표", "rules": ["<b>지속.</b> 52주 중 순매수였던 주의 비율, 누적 순매수가 일직선에 가까운 정도(R²), 가장 많이 산 닷새에 기대지 않는 정도.", "<b>강도.</b> 순매수 ÷ 거래대금, 순매수 금액의 크기.", "<b>추이.</b> 1년 순매수 중 최근 90일이 차지하는 비중. 지금도 이어지는지를 봅니다.", "<b>BTC 대비 강함.</b> BTC로 나눈 가격의 1년 변화와 최근 120일 추세. 비트코인에 끌려 내려가지 않았는지를 봅니다.", "<b>독립성.</b> 비트코인과의 일간 수익률 상관이 낮을수록 높은 점수."], "barsH": "종합 점수 상위", "barsP": "아홉 지표의 표준점수 합입니다. 막대 길이는 1위 대비 비율입니다.", "sens": [["JST", 100, "18.7"], ["TRX", 62.8, "11.7"], ["MORPHO", 49.1, "9.2"], ["COMP", 48.7, "9.1"], ["GTC", 47.7, "8.9"], ["ORCA", 41.4, "7.7"], ["BCH", 41.1, "7.7"], ["OGN", 35.4, "6.6"]], "sensNote": "JST는 2위와 차이가 크지만, 3위 MORPHO와 4위 COMP는 0.06점 차이입니다. 규모 지표를 빼면 COMP와 MORPHO가 같은 점수가 되고 GTC가 3위로 올라옵니다.", "mktH": "시장 배경: 1년 내내 파는 쪽이 급했다", "mktLede": "1년 동안 BTC는 94,594에서 68,314 USDT로 28% 내렸고, 코인 가격의 중앙값은 61% 내렸습니다. 시장가 체결은 BTC −118.5억, ETH −54.1억, 그 외 코인 −114.8억 USDT로 모두 순매도였습니다.", "mktTake": ["<b>BTC가 순매수였던 달은 13개월 중 3번</b>(2026년 4월, 8월, 11월 1~13일)뿐입니다. 그 외 코인 합계는 한 달도 순매수가 아니었습니다.", "<b>순매도가 가장 컸던 달은 2월과 6월</b>입니다(BTC −34.3억, −16.9억 USDT). 2월 5~6일 6만 달러 급락, 6~7월 ETF 자금 유출과 57.7K 저점 보도와 시기가 맞습니다.", "<b>순매수였던 코인은 498개 중 120개</b>(24%)입니다. 월별로는 18~45% 사이였습니다.", "<b>신흥국 통화로 USDT를 사는 흐름은 +17.7억 USDT</b>로 이어졌습니다(리라·헤알·페소 페어의 USDT 순매수). 코인으로 가지 않고 달러 대용으로 머문 돈입니다.", "<b>9월 반등은 짧았습니다.</b> 보도에 따르면 9월 15일 CLARITY 법안이 상원에서 부결됐고, 16일 연준이 금리를 올렸습니다. BTC 점유율은 59~60%로 올랐습니다.", "<b>10월 30일~11월 3일은 주의 구간</b>입니다. 바이낸스가 도난당한 알트코인을 거래소 안에서 되샀다고 밝혀 순매수가 부풀 수 있습니다."], "othH": "차점자와 대조군", "othP": "점수가 근소하게 모자란 코인과, 최근 유입은 크지만 꾸준하지 않아 점수가 낮은 코인입니다.", "groups": [{"title": "차점자", "rows": [["COMP", "4위(9.1점). 13개월 모두 순매수지만 가격이 BTC보다 약했습니다. \"조용한 매집\" 쪽에 더 맞는 코인입니다."], ["GTC", "5위(8.9점). 최근 120일에 BTC 대비 3배로 급등했고 순매수의 67%가 닷새에 몰려 있습니다."], ["ORCA", "6위(7.7점). 52주 중 37주가 순매수였지만 최근 90일 유입이 1년의 4%로 식었습니다."], ["BCH", "7위(7.7점). 규모는 2위지만 가격이 BTC보다 36% 약했습니다. \"조용한 매집\" 쪽 코인입니다."]]}, {"title": "최근 유입은 크지만 꾸준하지 않은 코인", "rows": [["SOL", "최근 90일 +3.46억 USDT로 유입 규모는 가장 큽니다. 다만 1~2월 대량 순매도 뒤의 반전이라 누적선이 고르지 않습니다(R² 0.53)."], ["ZEC", "최근 90일 +2.61억 USDT, 가격 +54%. 8~9월 급등 때 몰린 추격 매수 성격이고 누적선이 가장 들쭉날쭉합니다(R² 0.17)."]]}], "verified": ["<b>수집 완료.</b> 바이낸스에서 거래 중인 현물 1,372개 페어의 1분봉을 상장한 달부터 모두 받았습니다(46,416개월 치).", "<b>바이낸스 원본과 일치.</b> 6개 코인 30개 페어의 365일 일별 순매수를 바이낸스 일봉의 시장가 매수 대금과 대조했고 10,950일 중 불일치는 0건입니다.", "<b>거래 연속성.</b> 10월 29일 해킹 보도 구간에도 BTCUSDT 1분봉은 하루 1,440개씩 빠짐없이 있습니다.", "<b>환율.</b> USDT가 아닌 호가(BTC·TRY·USDC 등) 페어는 그날의 종가 환율로 USDT로 바꿔 더했습니다.", "<b>일회성 구간 점검.</b> 해킹 직후 닷새가 1년 순매수에서 차지하는 비중은 JST +2.6%, TRX +8.1%, MORPHO +3.6%입니다."], "limits": ["<b>세 코인 모두 매수 주체가 뚜렷합니다.</b> JST는 프로토콜 바이백, TRX는 계열 상장사와 USDT 송금 수요, MORPHO는 기관의 약정 매입입니다. 이런 매수는 계획이 끝나면 멈춥니다.", "<b>이미 강했던 코인입니다.</b> 이 장의 기준은 \"앞으로 오를 코인\"이 아니라 \"지난 1년에 매집의 힘이 가장 뚜렷했던 코인\"입니다.", "<b>시장가 순매수는 보유량 증가가 아닙니다.</b> 급하게 산 쪽이 더 많았다는 뜻입니다. 지정가로 천천히 사 모으는 매집은 잡히지 않습니다.", "<b>바이낸스 현물만 봅니다.</b> 다른 거래소, 선물, 온체인 이동은 들어 있지 않습니다.", "<b>빠진 페어.</b> 한자 이름 코인 2개(6개 페어)는 서버 오류로 집계에 없습니다.", "<b>외부 자료.</b> 뉴스·토큰 일정은 검색으로 찾은 보도이고, 일부는 1차 자료를 직접 열어 보지 못했습니다.", "<b>투자 권유가 아닙니다.</b> 데이터가 보여 주는 것과 보여 주지 못하는 것을 구분해 읽어 주세요."], "sources": [["JST 5차 바이백·소각", "https://cryptoslate.com/just-completes-5th-jst-buyback-burn-over-170m-tokens-23-53m-burned-ahead-of-major-deflationary-upgrade/"], ["트론의 USDT 발행량이 이더리움 추월", "https://crypto.news/tron-q3-2026-usdt-ethereum-stablecoin-supply/"], ["트론 USDT 940억 달러", "https://cryptobriefing.com/tron-surpasses-ethereum-usdt-supply-94b/"], ["해킹 공격자의 TRX 교환·매도", "https://cryptoticker.io/en/tron-trx-price-below-pre-hack-level-binance-attacker/"], ["Canary 스테이킹 TRX ETF 신청서", "https://www.sec.gov/Archives/edgar/data/2064768/000199937126018236/trx-s1a_081926.htm"], ["아폴로의 MORPHO 최대 9천만 개 매입 계약 (2026-02)", "https://cointelegraph.com/news/apollo-deepens-blockchain-play-enters-crypto-lending-via-morpho-partnership"], ["Morpho 1.75억 달러 토큰 투자 (2026-06-09)", "https://www.theblock.co/post/404111/morpho-raises-175m-paradigm-a16z-crypto-ribbit-capital"], ["Morpho 예치금(TVL)", "https://defillama.com/protocol/morpho"], ["MORPHO 토큰 해제 일정", "https://app.tokenomics.com/tokenomics/morpho/unlocks"], ["SOL 시장가 매수/매도 비율 보도", "https://www.fxstreet.com/cryptocurrencies/news/solana-price-forecast-bearish-grip-tightens-on-sol-amid-broader-market-sell-off-202611130559"], ["바이낸스 해킹과 도난 알트코인 재매수 (2026-10-29~)", "https://crypto.news/binance-buys-back-stolen-altcoins-after-hack/"], ["해킹 경과 요약", "https://www.trmlabs.com/resources/blog/north-korea-steals-usd-6-36-billion-from-binance-in-the-largest-hack-in-history"], ["2월 5~6일 BTC 6만 달러 급락", "https://www.coindesk.com/markets/2026/02/06/bitcoin-s-crash-to-usd60-000-has-traders-hunting-for-a-hidden-fund-blowup"], ["7월 1일 BTC 57.7K 저점과 ETF 유출", "https://www.tradingpedia.com/2026/07/01/bitcoin-slides-toward-58k-as-etf-outflows-rise/"], ["9월 16일 연준 금리 인상", "https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html"], ["9월 15일 CLARITY 법안 상원 표결 부결", "https://www.americanbanker.com/news/crypto-market-structure-bill-fails-in-senate-vote-49-50"], ["BTC 점유율 59~60%", "https://247wallst.com/investing/cryptocurrency/2026/10/28/bitcoin-controls-59-5-of-the-crypto-market-is-altcoin-season-still-possible/"]], "foot": "분석 기준일 2026-11-14. 가격·순매수는 2026-11-13(UTC) 마감분까지입니다. 방식은 C(체결): 바이낸스가 1분봉마다 기록한 시장가 매수 체결량."};
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, html='') => { const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(html) e.innerHTML=html; return e; };
const SVG = (tag, attrs={}) => { const e=document.createElementNS('http://www.w3.org/2000/svg', tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const eok = v => (v/1e8);
const fEok = (v, d=2) => (v>=0?'+':'−') + Math.abs(v/1e8).toFixed(d) + '억';
const fPct = (v, d=1) => (v>=0?'+':'−') + Math.abs(v).toFixed(d) + '%';
const cls = v => v>=0 ? 'pos' : 'neg';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 선·면 그래프 (십자선 + 말풍선) ---------- */
function lineChart(host, dates, vals, o){
  const W=520, H=o.h||130, m={l:46,r:10,t:8,b:o.xlabels===false?6:20};
  const svg=SVG('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':o.label||''});
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(o.zero){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  if(o.ref!=null){ lo=Math.min(lo,o.ref); hi=Math.max(hi,o.ref); }
  const pad=(hi-lo)*0.08||1; lo-=o.zero&&lo===0?0:pad; hi+=pad;
  const x=i=>m.l+(W-m.l-m.r)*i/(vals.length-1), y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));
  const ticks=niceTicks(lo,hi,3);
  ticks.forEach(t=>{ svg.append(SVG('line',{class:'grid',x1:m.l,x2:W-m.r,y1:y(t),y2:y(t)})); const tx=SVG('text',{x:m.l-6,y:y(t)+3.5,'text-anchor':'end'}); tx.textContent=o.yfmt(t); svg.append(tx); });
  if(o.ref!=null){ svg.append(SVG('line',{class:'zero',x1:m.l,x2:W-m.r,y1:y(o.ref),y2:y(o.ref)})); }
  if(o.zero){ svg.append(SVG('line',{class:'zero',x1:m.l,x2:W-m.r,y1:y(0),y2:y(0)})); }
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  if(o.area){ const base=y(o.zero?0:lo); svg.append(SVG('polygon',{points:`${x(0)},${base} ${pts} ${x(vals.length-1)},${base}`,fill:o.color,'fill-opacity':.16,stroke:'none'})); }
  svg.append(SVG('polyline',{points:pts,fill:'none',stroke:o.color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  svg.append(SVG('circle',{cx:x(vals.length-1),cy:y(vals[vals.length-1]),r:3.5,fill:o.color,stroke:css('--panel'),'stroke-width':2}));
  if(o.xlabels!==false){ monthMarks(dates).forEach(([i,lab])=>{ const tx=SVG('text',{x:x(i),y:H-5,'text-anchor':'middle'}); tx.textContent=lab; svg.append(tx); }); }
  const cross=SVG('line',{class:'cross',y1:m.t,y2:H-m.b,visibility:'hidden'}); const dot=SVG('circle',{r:4,fill:o.color,stroke:css('--panel'),'stroke-width':2,visibility:'hidden'});
  svg.append(cross,dot); host.append(svg);
  const tip=el('div',{class:'tip',hidden:''}); host.append(tip);
  const move=ev=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width*W; let i=Math.round((px-m.l)/(W-m.l-m.r)*(vals.length-1)); i=Math.max(0,Math.min(vals.length-1,i));
    cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('visibility','visible'); dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(vals[i])); dot.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`<span class="d">${dates[i]}</span><br><b class="num">${o.tfmt(vals[i])}</b>`; tip.style.left=(x(i)/W*100)+'%'; tip.style.top=(y(vals[i])/H*r.height-8)+'px'; };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerleave',()=>{tip.hidden=true;cross.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');});
}
function niceTicks(lo,hi,n){ const span=hi-lo, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), f=step0/mag; const step=(f<1.5?1:f<3?2:f<7?5:10)*mag; const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(+v.toFixed(10)); return out; }
function monthMarks(dates){ const out=[]; let last=''; dates.forEach((d,i)=>{ const mo=d.slice(0,7); if(mo!==last && d.slice(8)==='01'){ const m=+d.slice(5,7); if(m%3===1) out.push([i, d.slice(2,4)+'.'+d.slice(5,7)]); } last=mo; }); return out; }

/* ---------- 월별 누적 막대 (0 기준 위아래) ---------- */
function flowChart(host, months){
  const W=520,H=190,m={l:46,r:10,t:8,b:22}; const svg=SVG('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'월별 시장가 순매수'});
  const keys=[['btc','--s2','BTC'],['eth','--s1','ETH'],['alt','--s3','그 외 코인']];
  let lo=0,hi=0; months.forEach(r=>{ let p=0,n=0; keys.forEach(([k])=>{ const v=eok(r[k]); if(v>=0)p+=v; else n+=v; }); hi=Math.max(hi,p); lo=Math.min(lo,n); });
  const pad=(hi-lo)*.06; lo-=pad; hi+=pad; const y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo)); const bw=(W-m.l-m.r)/months.length;
  niceTicks(lo,hi,4).forEach(t=>{ svg.append(SVG('line',{class:'grid',x1:m.l,x2:W-m.r,y1:y(t),y2:y(t)})); const tx=SVG('text',{x:m.l-6,y:y(t)+3.5,'text-anchor':'end'}); tx.textContent=t; svg.append(tx); });
  host.append(svg); const tip=el('div',{class:'tip',hidden:''}); host.append(tip);
  months.forEach((r,i)=>{ let up=0,dn=0; const cx=m.l+bw*i+bw/2, w=Math.min(26,bw-8); const g=SVG('g');
    keys.forEach(([k,c])=>{ const v=eok(r[k]); if(!v) return; let y0,y1; if(v>=0){ y0=y(up+v); y1=y(up); up+=v; } else { y0=y(dn); y1=y(dn+v); dn+=v; }
      g.append(SVG('rect',{x:cx-w/2,y:y0+1,width:w,height:Math.max(0,y1-y0-2),rx:2,fill:css(c)})); });
    const hit=SVG('rect',{x:m.l+bw*i,y:m.t,width:bw,height:H-m.t-m.b,fill:'transparent'}); g.append(hit); svg.append(g);
    const tx=SVG('text',{x:cx,y:H-6,'text-anchor':'middle'}); tx.textContent=r.month.slice(2).replace('-','.'); if(i%2===0||months.length<8) svg.append(tx);
    hit.addEventListener('pointerenter',()=>{ tip.hidden=false; tip.innerHTML=`<span class="d">${r.month}${i===months.length-1?' (13일까지)':i===0?' (14일부터)':''}</span><br>`+keys.map(([k,c,n])=>`<span style="color:${css(c)}">■</span> ${n} <b class="num">${fEok(r[k])}</b>`).join('<br>'); tip.style.left=(cx/W*100)+'%'; tip.style.top=(y(up)/H*svg.getBoundingClientRect().height-6)+'px'; });
    hit.addEventListener('pointerleave',()=>tip.hidden=true); });
  svg.append(SVG('line',{class:'zero',x1:m.l,x2:W-m.r,y1:y(0),y2:y(0)}));
}

    <div class="chart-label"><b>누적 순매수</b><span class="num">${fEok(c.net)} USDT</span></div><div class="chart" data-k="cum"></div>
    <dl class="kv">
      <dt>순매수가 +인 주</dt><dd>${Math.round(c.pos_weeks*52)} / 52주</dd>
      <dt>순매수가 +인 달</dt><dd>${c.pos_months} / ${c.n_months}개월</dd>
      <dt>가장 많이 산 5일의 비중</dt><dd>${(c.top5*100).toFixed(0)}%</dd>
      <dt>최근 6개월 · 90일 순매수</dt><dd>${fEok(c.net6)} · ${fEok(c.net90)}</dd>
      <dt>순매수 ÷ 시가총액</dt><dd>${c.net_mcap!=null?c.net_mcap.toFixed(1)+'%':'–'}</dd>
      <dt>가격 1년 (USDT · BTC 대비)</dt><dd><span class="${cls(c.px_chg)}">${fPct(c.px_chg,0)}</span> · <span class="${cls(c.ratio_chg)}">${fPct(c.ratio_chg,0)}</span></dd>
      <dt>BTC 대비 최근 120일 추세</dt><dd><span class="${cls(c.tr120)}">${fPct(c.tr120,0)}</span></dd>
      <dt>최근 30일 거래대금 (1년 중앙값 대비)</dt><dd>${(c.v30*100).toFixed(0)}%</dd>
    </dl>
    <p class="risk"><b>주의</b> ${n.risk}</p>`;
  $('#picks').append(card);
  lineChart($('[data-k=ratio]',card), c.dates, c.ratio, {color:css('--s1'), ref:100, xlabels:false, h:120, yfmt:v=>v.toFixed(0), tfmt:v=>'BTC 대비 '+v.toFixed(1), label:b+' BTC 대비 가격'});
  lineChart($('[data-k=cum]',card), c.dates, c.cum.map(v=>v/100), {color:css('--s3'), zero:true, area:true, h:130, yfmt:v=>v.toFixed(Math.abs(v)<1&&v!==0?2:1)+'억', tfmt:v=>'누적 '+(v>=0?'+':'−')+Math.abs(v).toFixed(2)+'억 USDT', label:b+' 누적 순매수'});
});
$('#steps').innerHTML = N.steps.map(s=>`<div class="step"><h3>${s.t}</h3><div class="big">${s.n}<small> ${s.u}</small></div><p>${s.d}</p></div>`).join('');
$('#rules').innerHTML = N.rules.map(r=>`<li>${r}</li>`).join('');
$('#sens').innerHTML = N.sens.map(([b,p,t])=>`<div class="bar-row"><span class="num">${b}</span><div class="track"><div class="fill${PICKS.includes(b)?'':' dim'}" style="width:${Math.max(0,Math.min(100,p))}%"></div></div><span class="num" style="text-align:right">${t}</span></div>`).join('');
$('#sens-note').textContent = N.sensNote;
$('#mkt-lede').textContent = N.mktLede;
const btc=D.btc; $('#btc-range').textContent = `${Math.round(btc[0][1]).toLocaleString()} → ${Math.round(btc[btc.length-1][1]).toLocaleString()}`;
lineChart($('#c-btc'), btc.map(r=>r[0]), btc.map(r=>r[1]), {color:css('--s2'), h:150, yfmt:v=>(v/1000).toFixed(0)+'K', tfmt:v=>Math.round(v).toLocaleString()+' USDT', label:'비트코인 가격'});
flowChart($('#c-flow'), D.market);
$('#flow-table').innerHTML = '<tr><th>월</th><th>BTC</th><th>ETH</th><th>그 외 코인</th><th>순매수인 코인 비율</th><th>BTC 월말 종가</th></tr>' + D.market.map(r=>`<tr><td>${r.month}</td><td class="num">${fEok(r.btc)}</td><td class="num">${fEok(r.eth)}</td><td class="num">${fEok(r.alt)}</td><td class="num">${(r.breadth*100).toFixed(0)}%</td><td class="num" style="text-align:right;min-width:0">${Math.round(r.btc_close).toLocaleString()}</td></tr>`).join('');
$('#mkt-take').innerHTML = N.mktTake.map(r=>`<li>${r}</li>`).join('');
const row=(b,why)=>{ const c=D.coins[b]; return `<tr><td><span class="tk">${b}</span></td><td class="num ${cls(c.net)}">${fEok(c.net)}</td><td class="num">${Math.round(c.pos_weeks*52)}/52</td><td class="num">${(c.top5*100).toFixed(0)}%</td><td class="num ${cls(c.px_chg)}">${fPct(c.px_chg,0)}</td><td class="num ${cls(c.ratio_chg)}">${fPct(c.ratio_chg,0)}</td><td class="num ${cls(c.tr120)}">${fPct(c.tr120,0)}</td><td>${why}</td></tr>`; };
$('#others').innerHTML = '<tr><th>코인</th><th>1년 순매수 (USDT)</th><th>+인 주</th><th>상위 5일 비중</th><th>가격 1년</th><th>BTC 대비 1년</th><th>BTC 대비 120일 추세</th><th>판단</th></tr>'
  + N.groups.map(g=>`<tr class="grp"><td colspan="8">${g.title}</td></tr>` + g.rows.map(([b,w])=>row(b,w)).join('')).join('');
$('#verified').innerHTML = N.verified.map(r=>`<li>${r}</li>`).join('');
$('#limits').innerHTML = N.limits.map(r=>`<li>${r}</li>`).join('');
$('#sources').innerHTML = N.sources.map(([t,u])=>`<li>${t} — <a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//,'').slice(0,70)}</a></li>`).join('');
$('#foot').textContent = N.foot;
</script>
</body></html>
